<!DOCTYPE html>
<html>
<head>
    <title>College Timetable</title>
</head>
<body>

<h2 align="center">College Timetable</h2>

<table border="1" align="center" cellpadding="10">
    <caption>Class Timetable</caption>

    <tr>
        <th>Day</th>
        <th>9-10 AM</th>
        <th>10-11 AM</th>
        <th>11-12 PM</th>
        <th>12-1 PM</th>
    </tr>

    <tr>
        <th>Monday</th>
        <td>Maths</td>
        <td>Physics</td>
        <td rowspan="2">Lab</td>
        <td>English</td>
    </tr>

    <tr>
        <th>Tuesday</th>
        <td>C Programming</td>
        <td>Maths</td>
        <td>Sports</td>
    </tr>

    <tr>
        <th>Wednesday</th>
        <td>Physics</td>
        <td colspan="2">Break</td>
        <td>English</td>
    </tr>

    <tr>
        <th>Thursday</th>
        <td>Maths</td>
        <td>English</td>
        <td>
            <table border="1">
                <tr>
                    <th>Practical</th>
                </tr>
                <tr>
                    <td>HTML Lab</td>
                </tr>
            </table>
        </td>
        <td>Physics</td>
    </tr>

    <tr>
        <th>Friday</th>
        <td>C Programming</td>
        <td>Maths</td>
        <td>English</td>
        <td>Sports</td>
    </tr>

</table>

</body>
</html>
