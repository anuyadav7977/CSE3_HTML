
<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking</title>
</head>
<body>
   
    <fieldset>
    
        <legend style="text-align: center;"> Biodata</legend> 
    <h1 style="text-align: center;"> Hotel Room Booking Form</h1>
<center>
    <form action="success.html" method="get">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin" required>
        <br><br>

        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout" required>
        <br><br>

        <label for="room">Room Type:</label>
        <select id="room" name="room">
            <option>Single Room</option>
            <option>Double Room</option>
            <option>Deluxe Room</option>
        </select>
        <br><br>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="10">
        <br><br>

        <label for="requests">Special Requests:</label>
        <br>
        <textarea id="requests" name="requests" rows="4" cols="30"></textarea>
        <br><br>

        <button type="submit">Book Room</button>
        <button type="reset">Reset</button>
    </form>
    
    </fieldset> 
</center>
</body>
</html>
