
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>
    <fieldset>
    <h1 style="text-align: center;">Student Registration Form</h1>
<center>
    <form action="CSE3_HTML/reg success.html" method="get">
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" minlength="4" maxlength="15" placeholder="Enter your name" required>
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="gender" name="gender" value="male" required>
       <label for="male">Male</label>
        <input type="radio" id="gender" name="gender" value="female" required>
        <label for="female">Female</label>

       
        <br><br>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll"
               placeholder="Enter roll number" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="abc@example.com" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter password" required>
        <br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option>B.Tech CSE</option>
            <option>B.Tech IT</option>
            <option>B.Tech ECE</option>
        </select>
        <br><br>

        <!-- Phone Number -->
<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone"
       placeholder="Enter your phone number"
       pattern="[0-9]{10}"
       maxlength="10"
       required>
<br><br>

<!-- Address -->
<label for="address">Address:</label>
<textarea id="address" name="address"
          rows="4" cols="30"
          placeholder="Enter your address"
          required></textarea>
<br><br>
        <button type="submit">Register</button>
        <button type="reset">Clear</button>
        
    </form>
    </fieldset>
</center>
</body>
</html>
